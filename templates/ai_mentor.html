<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atolagbe Academy - AI Mentor Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .chat-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; overflow-y: scroll; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
        .user-msg { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai-msg { background: #e2e3e5; color: #333; margin-right: auto; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>🧠 AI Expert Hub</h2>
        <div>
            <label for="personaSelect"><strong>Select Expert:</strong></label>
            <select id="personaSelect">
                <option value="student">Student / Tutor</option>
                <option value="business">Business Strategist</option>
                <option value="creator">Content Creator</option>
                <option value="investor">Investing Educator</option>
                <option value="job_seeker">Career Coach</option>
                <option value="fitness">Fitness Coach</option>
                <option value="developer">Senior Software Engineer</option>
                <option value="writer">Writing Coach & Editor</option>
                <option value="language_learner">Language Tutor</option>
                <option value="speaker">Public Speaking Coach</option>
                <option value="mindfulness">Mindfulness Guide</option>
                <option value="parent">Parenting Helper</option>
                <option value="general" selected>General Assistant</option>
            </select>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Hello! Choose your expert persona above and ask me anything to get started.</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const personaSelect = document.getElementById('personaSelect');
        
        const messageText = inputField.value.trim();
        if (!messageText) return;

        // Append User Message
        chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(messageText)}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Append Loading State
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai-msg">Thinking...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/ai-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: messageText,
                    persona: personaSelect.value
                })
            });

            const data = await response.json();
            
            // Remove loading indicator
            document.getElementById(loadingId).remove();

            // Append AI Response
            chatBox.innerHTML += `<div class="message ai-msg">${escapeHtml(data.reply)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

        } catch (error) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai-msg" style="color: red;">Error communicating with AI mentor.</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function handleKey(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
