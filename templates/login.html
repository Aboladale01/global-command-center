<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #282a36;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        button {
            background-color: #ff79c6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #ff92d0;
        }
    </style>
</head>
<body>
<div class="login-box">
        <h2>System Override Access</h2>
        <form action="/login" method="POST">
        <form method="POST" action="{{ url_for('login') }}">
       <input type="text" name="username" placeholder="Commander Username">
       <input type="password" name="password" placeholder="Access Code">
       <button type="submit" class="btn-primary">Authenticate</button>
        </form>
        </form>
    </div>
</body>
</html>
