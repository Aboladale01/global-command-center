<div class="card" style="background-color: #1e293b; padding: 30px; border-radius: 12px; color: #f8fafc;">
    <h2>📖 Live Reading Hub: {{ title }}</h2>
    <hr style="border-color: rgba(255,255,255,0.1);">
    
    <div class="reading-box" style="background: #0f172a; padding: 20px; border-radius: 8px; margin: 20px 0; max-height: 400px; overflow-y: auto; line-height: 1.6;">
        <p>{{ content }}</p>
    </div>

    <div class="download-gate" style="background: rgba(245, 158, 11, 0.1); border: 1px dashed #f59e0b; padding: 20px; border-radius: 8px; text-align: center;">
        <h3>Want to take this with you?</h3>
        <p style="color: #94a3b8; font-size: 0.9rem;">Enter your email below to instantly receive the full downloadable file to your inbox.</p>
        
        <form action="/send-download" method="POST" style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
            <input type="email" name="user_email" placeholder="Enter your email address..." required style="padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; width: 250px;">
            <button type="submit" style="background: #f59e0b; color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Send Me the File</button>
        </form>
    </div>
</div>
